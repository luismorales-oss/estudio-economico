  <h2>Cuánto dinero hay que poner antes de facturar el primer peso</h2>
  <p class="desc">Tres cosas distintas conviven acá: lo que comprás y queda (activo fijo), lo que gastás una sola vez para poder abrir (gastos pre operativos) y la plata que tenés que dejar dando vueltas para sostener la operación hasta que empiece a cobrar (capital de trabajo).</p>
</div>

<div class="bloque">
  <h3>Detalle de la inversión</h3>
  <div class="cuerpo sinpad tabla-wrap">
    <table>
      <thead><tr><th>Rubro</th><th class="n">Valor unitario</th><th class="n">Unidades requeridas</th><th class="n">Inversión total</th><th></th></tr></thead>
      <tbody>${filas}</tbody>
      <tr class="total"><td colspan="3">Total activo fijo</td><td class="n">${$$(C.activoFijo)}</td><td></td></tr>
      <tr class="total"><td colspan="3">Total gastos pre operativos</td><td class="n">${$$(C.preop)}</td><td></td></tr>
      <tr class="total"><td colspan="3">Total capital de trabajo</td><td class="n">${$$(C.ctrab)}</td><td></td></tr>
      <tr class="total-mayor"><td colspan="3">Inversión inicial</td><td class="n">${$$(C.inv0)}</td><td></td></tr>
    </table>
  </div>
  <div class="cuerpo">
    ${C.ctrab <= 0 && (C.CF+C.CV) > 0 ? nota("mal","Falta el capital de trabajo",`Cargaste inversión en activos pero no capital de trabajo. Es el error más frecuente en los planes de negocio: el emprendimiento compra las máquinas, abre, y a los dos meses no tiene con qué pagar la materia prima porque todavía no cobró. Como referencia, tus costos operativos de un ${perLabel()} son ${$$(C.CF+C.CV)}; cubrir <strong>${S.meta.periodo==="mes"?"dos o tres meses":"buena parte del primer año"}</strong> sería del orden de ${$$(ctSugerido)}.`) : ""}
    ${C.porGrupoInv.terreno > 0 ? nota("","Sobre el terreno",`Los terrenos no se deprecian: no pierden capacidad de servicio con el uso. Si tu proyecto usa un inmueble de la familia o cedido por un tercero, cargalo igual a valor de mercado —o al menos el alquiler equivalente como costo fijo—, porque de lo contrario el proyecto aparenta una rentabilidad que en realidad está subsidiada.`) : ""}
    ${nota("","Pre operativos, no operativos", `Habilitaciones municipales, inscripción en AFIP y Bromatología, registro de marca, honorarios del contador para la constitución, capacitación inicial del personal, la primera tanda de folletería. Se pagan una sola vez y antes de vender: no son costos del período, son inversión.`)}
  </div>
</div>`;
};

/* ---------- 3. Estructura de costos ---------- */
/* ---------- 3. Financiamiento ---------- */
PANEL[3] = C => {
  const filas = C.credito.slice(0, 240).map(c => `<tr>
      <td class="n">${c.t}</td><td class="n">${$$(c.ini)}</td><td class="n">${$$(c.int)}</td>
      <td class="n">${$$(c.am)}</td><td class="n"><b>${$$(c.cuota)}</b></td><td class="n">${$$(c.fin)}</td>
      ${c.t<=C.n?`<td class="n">${isFinite(C.F.filas.sai[c.t-1])?fmt((C.F.filas.sai[c.t-1]-C.F.filas.impF[c.t-1])/c.cuota,2):"—"}</td>`:'<td class="n" style="color:var(--texto-3)">fuera del horizonte</td>'}
    </tr>`).join("");

  const form = `
    <div class="grid g4">
      ${campo("Monto solicitado al banco", inp("meta.fin.monto",{num:true}), C.inv0>0?`Equivale al ${pct(C.wD,0)} de la inversión`:"Cargá primero el plan de inversión")}
      ${campo("Tasa nominal anual (TNA) %", inp("meta.fin.tasa",{num:true}), `Efectiva anual: ${pct(C.TEA,1)}`)}
      ${campo("Plazo en "+perLabelPl(), inp("meta.fin.plazo",{num:true}))}
      ${campo("Sistema de amortización", sel("meta.fin.sistema",[["frances","Francés · cuota fija"],["aleman","Alemán · amortización fija"]]))}
    </div>
    <div class="grid g4" style="margin-top:12px">
      ${campo("Períodos de gracia", inp("meta.fin.gracia",{num:true}), "Sólo se pagan intereses.")}
      ${campo("Gastos de otorgamiento %", inp("meta.fin.gastos",{num:true}), "Sellado, seguro de vida, gastos administrativos.")}
      ${campo("Rendimiento exigido al capital propio %", inp("meta.fin.ke",{num:true}), "Anual. Si lo dejás vacío se usa la tasa del paso 0.")}
      <div></div>
    </div>`;

  const tarjetas = `
    <div class="tarjetas" style="border:1px solid var(--linea)">
      <div class="tarjeta"><div class="lab">Aporte propio</div><div class="val ${C.aporte<0?"neg":""}">${$$(C.aporte)}</div><div class="hint">${C.inv0>0?pct(1-C.wD,0)+" de la inversión":""}</div></div>
      <div class="tarjeta"><div class="lab">Cuota por ${perLabel()}</div><div class="val">${$$(C.cuotaTipo)}</div><div class="hint">${C.sistema==="frances"?"constante":"decreciente"}</div></div>
      <div class="tarjeta"><div class="lab">Intereses totales</div><div class="val">${$$(C.interesTotal)}</div><div class="hint">${C.montoP>0?pct(C.interesTotal/C.montoP,0)+" del capital":""}</div></div>
      <div class="tarjeta"><div class="lab">Costo efectivo anual</div><div class="val">${pct(C.TEA,1)}</div><div class="hint">Después de impuestos: ${pct(C.kD,1)}</div></div>
      <div class="tarjeta"><div class="lab">Costo promedio del capital</div><div class="val">${pct(C.WACC,1)}</div><div class="hint">Mezcla de banco y socios</div></div>
      <div class="tarjeta"><div class="lab">Cobertura de la cuota</div><div class="val ${C.dscrMin<1.2?"neg":"pos"}">${isFinite(C.dscrMin)?fmt(C.dscrMin,2):"—"}</div><div class="hint">La peor del horizonte</div></div>
    </div>`;

  return `
<div class="enc">
  <div class="eyebrow">Financiamiento de la inversión</div>
  <h2>Quién pone la plata y a qué costo</h2>
  <p class="desc">La inversión de ${$$(C.inv0)} tiene que salir de algún lado. Lo que se pide prestado tiene un precio —la tasa— y una obligación de pago que no depende de cómo le vaya al negocio. Lo que ponen los socios no tiene cuota, pero sí exige un rendimiento: si no, les convenía dejarlo en el banco.</p>
</div>

<div class="bloque">
  <h3>Estructura de financiamiento</h3>
  <div class="cuerpo">
    ${chk("meta.fin.usa","Este proyecto toma un crédito","Desactivado, el análisis supone que los socios aportan el 100 % de la inversión.")}
    ${C.usaFin ? `<div style="margin-top:14px">${form}</div>` : nota("","Sin deuda", `Mientras la casilla esté desactivada, el flujo de fondos supone que la inversión se financia íntegramente con capital propio. Activala para simular un crédito del Banco del Chaco, del Consejo Federal de Inversiones, una línea de reactivación productiva o cualquier otra fuente, y comparar los dos escenarios.`)}
  </div>
</div>

${C.usaFin ? `
<div class="bloque">
  <h3>Condiciones resultantes</h3>
  <div class="cuerpo">
    ${tarjetas}
    ${C.montoP > C.inv0 && C.inv0 > 0 ? nota("mal","Pedís más de lo que necesitás", `El monto solicitado (${$$(C.montoP)}) supera la inversión total del proyecto (${$$(C.inv0)}). Ningún banco financia más que el destino declarado, y si lo hiciera estarías pagando intereses por dinero ocioso. Ajustá el monto o revisá el plan de inversión.`) : ""}
    ${C.montoP > 0 && C.plazo <= 0 ? nota("amb","Falta el plazo", "Sin plazo no hay cuota que calcular. Indicá en cuántos "+perLabelPl()+" se devuelve el préstamo.") : ""}
    ${C.plazo > C.n ? nota("amb","El crédito dura más que el análisis", `El préstamo se paga en ${C.plazo} ${perLabelPl()} pero el proyecto se evalúa en ${C.n}. Para que las cuentas cierren, en el último período se descuenta el saldo pendiente de ${$$(C.saldoFinal)} como si se cancelara anticipadamente. Es una convención razonable, pero conviene mencionarla en el informe.`) : ""}
    ${isFinite(C.dscrMin) ? nota(C.dscrMin<1.2?(C.dscrMin<1?"mal":"amb"):"ok","Cobertura del servicio de deuda", `Este indicador compara lo que el negocio genera cada ${perLabel()} contra la cuota que debe pagar. ${C.dscrMin<1 ? `En el peor ${perLabel()} la cobertura es de ${fmt(C.dscrMin,2)}: <strong>el proyecto no genera lo suficiente para pagar la cuota</strong> y hay que poner plata de afuera.` : C.dscrMin<1.2 ? `La peor cobertura es de ${fmt(C.dscrMin,2)}. Los bancos suelen exigir un mínimo de 1,20 a 1,30 justamente porque un margen tan fino no tolera ningún imprevisto.` : `La peor cobertura del horizonte es de ${fmt(C.dscrMin,2)} y el promedio ${fmt(C.dscrProm,2)}: el flujo paga la cuota con holgura. Es el número que un analista de créditos mira primero.`}`) : ""}
    ${nota("","TNA, TEA y la letra chica", `Los bancos publican la <strong>tasa nominal anual</strong>, que se divide por doce para obtener la mensual. Pero como cada mes se capitaliza, lo que realmente pagás es la <strong>tasa efectiva anual</strong>: con una TNA del ${pct(C.tna,0)} el costo efectivo trepa a ${pct(C.TEA,1)}. Y todavía falta el costo financiero total, que incluye seguros, sellado y gastos administrativos. Si conseguís la hoja de condiciones de una línea real, cargá acá el CFT en lugar de la TNA y el análisis va a ser mucho más honesto.`)}
    ${C.tax>0 ? nota("","Los intereses pagan menos impuesto", `A diferencia de la amortización del capital, los intereses son deducibles: reducen la ganancia imponible y por lo tanto el impuesto. Por eso el costo real del crédito no es ${pct(C.TEA,1)} sino ${pct(C.kD,1)} anual. Ese ahorro fiscal ya está calculado en el flujo del inversionista.`) : ""}
  </div>
</div>

<div class="bloque">
  <h3>Cuadro de marcha del préstamo <span class="chip">Sistema ${C.sistema}</span></h3>
  <div class="cuerpo sinpad tabla-wrap" style="max-height:520px;overflow-y:auto">
    <table>
      <thead><tr><th class="n">${S.meta.periodo==="mes"?"Mes":"Año"}</th><th class="n">Saldo inicial</th><th class="n">Interés</th><th class="n">Amortización</th><th class="n">Cuota</th><th class="n">Saldo final</th><th class="n">Cobertura</th></tr></thead>
      <tbody>${filas || '<tr><td colspan="7" style="color:var(--texto-3)">Completá monto, tasa y plazo para ver el cuadro.</td></tr>'}</tbody>
    </table>
  </div>
  <div class="cuerpo">
    ${nota("","Francés o alemán", `En el <strong>sistema francés</strong> la cuota es siempre la misma: al principio casi todo es interés y muy poco capital, y recién sobre el final se amortiza en serio. Es más cómodo para planificar y es el que usan casi todos los bancos comerciales. En el <strong>alemán</strong> se devuelve siempre la misma porción de capital, así que la cuota arranca alta y va bajando; se pagan menos intereses en total, pero exige más caja en los primeros ${perLabelPl()}, que es justo cuando el emprendimiento está más flojo. Probá los dos y mirá qué le pasa a la cobertura del primer año.`)}
    ${C.gracia > 0 ? nota("","Sobre el período de gracia", `Durante los primeros ${C.gracia} ${perLabelPl()} sólo se pagan intereses. Alivia el arranque, que es cuando el negocio todavía no vende a régimen, pero no regala nada: el capital sigue entero y los intereses de ese tramo se pagan igual. Al final se termina desembolsando más.`) : ""}
  </div>
</div>` : ""}`;
};

/* ---------- 4. Estructura de costos ---------- */
PANEL[4] = C => {
  let filas = "";
  ["directo","indirecto"].forEach(clase => {
    filas += `<tr class="grupo"><td colspan="7">${clase==="directo"?"1 · Costos directos":"2 · Costos indirectos"}</td></tr>`;
    G_COS.filter(g=>g.clase===clase).forEach(g => {
      const items = S.costos.map((it,i)=>({it,i})).filter(x=>x.it.grupo===g.k);
      filas += `<tr class="sub"><td colspan="6">${g.t}</td><td class="acc"><button class="ghost mini" data-act="addCos" data-g="${g.k}">+</button></td></tr>`;
      items.forEach(({it,i}) => {
        const tot = num(it.vu)*num(it.cant);
        filas += `<tr>
          <td>${inp(`costos.${i}.detalle`,{ph:"Detalle"})}</td>
          <td style="width:120px">${inp(`costos.${i}.vu`,{num:true})}</td>
          <td style="width:95px">${inp(`costos.${i}.cant`,{num:true})}</td>
          <td style="width:105px">${sel(`costos.${i}.tipo`,[["V","Variable"],["F","Fijo"]])}</td>
          <td style="width:140px">${sel(`costos.${i}.prod`, [["","Todos los productos"]].concat(S.productos.map((p,j)=>[p.id, p.nombre||("Producto "+(j+1))])))}</td>
          <td class="n" style="width:120px">${$$(tot)}</td>
          <td class="acc"><button class="x" data-act="delCos" data-i="${i}">×</button></td></tr>`;
      });
      if (!items.length) filas += `<tr><td colspan="7" style="color:var(--texto-3);font-size:12.5px">Sin ítems.</td></tr>`;
    });
    const cf = G_COS.filter(g=>g.clase===clase).reduce((s,g)=>s+C.fijoG[g.k],0);
    const cv = G_COS.filter(g=>g.clase===clase).reduce((s,g)=>s+C.varG[g.k],0);
    filas += `<tr class="total"><td colspan="5">Total costos ${clase}s</td><td class="n">${$$(cf+cv)}</td><td></td></tr>`;
  });

  return `
<div class="enc">
  <div class="eyebrow">4.3 · Estructura de costos</div>
  <h2>Qué gastás cada ${perLabel()} para producir y vender</h2>
  <p class="desc">La clasificación decisiva no es directo/indirecto sino <strong>fijo/variable</strong>: de ahí salen el punto de equilibrio y el riesgo operativo. Fijo es lo que pagás aunque no vendas una sola unidad. Variable es lo que aparece únicamente cuando producís.</p>
</div>

<div class="bloque">
  <h3>Costos de un ${perLabel()} <span class="chip">Cargar valores de un solo período</span></h3>
  <div class="cuerpo sinpad tabla-wrap">
    <table>
      <thead><tr><th>Rubro</th><th class="n">Valor unitario</th><th class="n">Unidades requeridas</th><th>Comportamiento</th><th>Se aplica a</th><th class="n">Costo total</th><th></th></tr></thead>
      <tbody>${filas}</tbody>
      <tr class="total-mayor"><td colspan="5">Costo total del ${perLabel()}</td><td class="n">${$$(C.CF+C.CV)}</td><td></td></tr>
    </table>
  </div>
  <div class="cuerpo">
    <div class="tarjetas" style="border:1px solid var(--linea)">
      <div class="tarjeta"><div class="lab">Costo fijo del ${perLabel()}</div><div class="val">${$$(C.CF)}</div></div>
      <div class="tarjeta"><div class="lab">Costo variable del período ${C.ref}</div><div class="val">${$$(C.CV)}</div></div>
      <div class="tarjeta"><div class="lab">Peso de los fijos</div><div class="val">${(C.CF+C.CV)>0?pct(C.CF/(C.CF+C.CV)):"—"}</div></div>
      <div class="tarjeta"><div class="lab">Unidades de referencia</div><div class="val">${fmt(C.baseTot)}</div></div>
    </div>
    ${nota("","Cómo decidir si es fijo o variable", `Preguntate: <em>si este ${perLabel()} no vendo nada, ¿lo pago igual?</em> El alquiler, el sueldo del encargado, el contador y el seguro se pagan igual: son fijos. La harina, la malta, las botellas, la energía del horno y la comisión del vendedor solo existen si producís y vendés: son variables. El caso incómodo es la mano de obra: en relación de dependencia es fijo, aunque la producción caiga; a destajo o por temporada se comporta como variable.`)}
    ${nota("amb","La trampa de la mano de obra", `Muchos trabajos de estudiantes olvidan pagarse el propio sueldo. Si vos y tus socios van a trabajar en el emprendimiento, cargá esa retribución como costo: un proyecto que solo cierra porque sus dueños trabajan gratis no es rentable, es un empleo mal pago disfrazado de negocio.`)}
    ${C.CV > 0 && C.baseTot <= 0 ? nota("mal","Faltan unidades",`Cargaste costos variables pero no hay unidades proyectadas en el período ${C.ref}. Sin producción no se puede unitarizar el costo variable. Volvé al paso 4.1.`) : ""}
  </div>
</div>`;
};

/* ---------- 4. Costo y precio unitario ---------- */
PANEL[5] = C => {
  const filas = S.productos.map((p,i)=>{
    const mgSobreVenta = C.precio[i] > 0 ? (C.precio[i]-C.CTU[i])/C.precio[i] : NaN;
    const alerta = C.precio[i] < C.CVU[i];
    return `<tr>
      <td>${esc(p.nombre||("Producto "+(i+1)))}</td>
      <td class="n">${$$(C.CVU[i],2)}</td>
      <td class="n">${$$(C.CFU,2)}</td>
      <td class="n"><b>${$$(C.CTU[i],2)}</b></td>
      <td class="n" style="width:100px">${p.modo==="manual" ? '<span class="chip">fijado</span>' : inp(`productos.${i}.markup`,{num:true})}</td>
      <td class="n ${alerta?"neg":""}">${$$(C.precio[i],2)}</td>
      <td class="n ${C.MC[i]<=0?"neg":"pos"}">${$$(C.MC[i],2)}</td>
      <td class="n">${isFinite(mgSobreVenta)?pct(mgSobreVenta):"—"}</td>
    </tr>`;
  }).join("");

  const bajoCosto = S.productos.map((p,i)=>({p,i})).filter(x => C.precio[x.i] < C.CTU[x.i] && C.precio[x.i] > 0);
  const bajoVariable = S.productos.map((p,i)=>({p,i})).filter(x => C.precio[x.i] < C.CVU[x.i] && C.precio[x.i] > 0);

  return `
<div class="enc">
  <div class="eyebrow">4.4 · Costo total unitario y precio</div>
  <h2>Cuánto cuesta cada unidad y a cuánto la vendés</h2>
  <p class="desc">El costo total unitario suma dos naturalezas distintas: lo que la unidad consume por existir (variable) y la porción de la estructura que le toca cargar (fijo). El precio sale de ahí más la ganancia pretendida —siempre que el mercado convalide ese número—.</p>
</div>

<div class="bloque">
  <h3>Del costo al precio</h3>
  <div class="cuerpo sinpad tabla-wrap">
    <table>
      <thead><tr><th>Producto</th><th class="n">CVU · variable</th><th class="n">CFU · fijo</th><th class="n">CTU · total</th><th class="n">Margen %</th><th class="n">Precio de venta</th><th class="n">Contribución marginal</th><th class="n">Margen s/ venta</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
  </div>
  <div class="cuerpo">
    <div class="tarjetas" style="border:1px solid var(--linea)">
      <div class="tarjeta"><div class="lab">Costo fijo unitario</div><div class="val">${$$(C.CFU,2)}</div><div class="hint">${$$(C.CF)} × ${C.n} ${perLabelPl()} ÷ ${fmt(C.uCiclo)} unidades</div></div>
      <div class="tarjeta"><div class="lab">Contribución marginal ponderada</div><div class="val">${$$(C.MCpond,2)}</div></div>
      <div class="tarjeta"><div class="lab">Razón de contribución</div><div class="val">${pct(C.razonMC)}</div><div class="hint">De cada peso vendido, esto queda para cubrir los fijos.</div></div>
    </div>
    ${bajoVariable.length ? nota("mal","Cada venta agranda la pérdida", `El precio de ${bajoVariable.map(x=>"<strong>"+esc(x.p.nombre||("Producto "+(x.i+1)))+"</strong>").join(", ")} está por debajo de su costo variable unitario. La contribución marginal es negativa: no existe volumen que salve el negocio, porque cuanto más vendés, más perdés. No hay punto de equilibrio posible en esta condición.`) : ""}
    ${!bajoVariable.length && bajoCosto.length ? nota("amb","Precio por debajo del costo total", `${bajoCosto.map(x=>"<strong>"+esc(x.p.nombre||("Producto "+(x.i+1)))+"</strong>").join(", ")} se vende por debajo del CTU. Cada unidad aporta algo para cubrir los fijos, pero no alcanza a cubrirlos del todo. Puede sostenerse como estrategia de entrada o para un producto gancho, nunca como situación permanente.`) : ""}
    ${nota("","Margen sobre el costo no es margen sobre la venta", `Un recargo del 30 % sobre un costo de 100 da un precio de 130, y la ganancia sobre la venta es 30/130 = 23 %, no 30 %. Es la confusión más cara del comercio minorista. La columna <em>margen s/ venta</em> te muestra el número que realmente importa cuando comparás contra la rentabilidad de otros negocios del rubro.`)}
    ${nota("amb","La circularidad del costo fijo unitario", `El CFU depende de cuántas unidades produzcas: si vendés menos, cada unidad carga más estructura y el costo sube justo cuando peor te va. Por eso el precio no debería definirse solo por planilla. Verificá que el número que te da la cuenta sea sostenible frente a la competencia relevada en el estudio de mercado; si no lo es, el ajuste va por costos o por escala, no por voluntarismo.`)}
  </div>
</div>`;
};

/* ---------- 5. Ventas proyectadas y equilibrio ---------- */
PANEL[6] = C => {
  const per = Array.from({length:C.n},(_,i)=>i+1);
  const filasV = S.productos.map((p,i)=>`
    <tr><td>${esc(p.nombre||("Producto "+(i+1)))}</td><td class="n">${$$(C.precio[i],2)}</td>
    ${per.map(t=>`<td class="n">${$$(C.precio[i]*C.P[i].u[t-1])}</td>`).join("")}
    <td class="n">${$$(C.precio[i]*C.P[i].uCiclo)}</td></tr>`).join("");
  const totalPer = per.map(t => S.productos.reduce((s,p,i)=> s + C.precio[i]*C.P[i].u[t-1], 0));

  const filasPE = S.productos.map((p,i)=>`
    <tr><td>${esc(p.nombre||("Producto "+(i+1)))}</td>
    <td class="n">${pct(C.mix[i])}</td>
    <td class="n">${$$(C.MC[i],2)}</td>
    <td class="n">${isFinite(C.PEqi[i])?fmt(C.PEqi[i],0):"—"}</td>
    <td class="n">${isFinite(C.PEqi[i])?$$(C.PEqi[i]*C.precio[i]):"—"}</td></tr>`).join("");

  return `
<div class="enc">
  <div class="eyebrow">4.5 y 4.6 · Ventas, contribución marginal y equilibrio</div>
  <h2>El punto donde el negocio deja de perder</h2>
  <p class="desc">El punto de equilibrio no es una meta, es un piso: la cantidad por debajo de la cual el emprendimiento destruye valor. Su distancia respecto de las ventas proyectadas mide cuánto margen de error tenés.</p>
</div>

<div class="bloque">
  <h3>Proyección de ventas en pesos</h3>
  <div class="cuerpo sinpad tabla-wrap">
    <table>
      <thead><tr><th>Producto</th><th class="n">Precio</th>${per.map(t=>`<th class="n">${t}</th>`).join("")}<th class="n">Total</th></tr></thead>
      <tbody>${filasV}</tbody>
      <tr class="total"><td colspan="2">Ingresos totales</td>${totalPer.map(v=>`<td class="n">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(totalPer))}</td></tr>
    </table>
  </div>
</div>

<div class="bloque">
  <h3>Punto de equilibrio por ${perLabel()}</h3>
  <div class="cuerpo">
    <div class="tarjetas" style="border:1px solid var(--linea)">
      <div class="tarjeta"><div class="lab">En unidades</div><div class="val">${isFinite(C.PEq)?fmt(C.PEq,0):"—"} <small>u/${perLabel()}</small></div></div>
      <div class="tarjeta"><div class="lab">En pesos</div><div class="val">${$$(C.PE$)}</div></div>
      <div class="tarjeta"><div class="lab">Ventas proyectadas promedio</div><div class="val">${$$(C.ventasProm)}</div></div>
      <div class="tarjeta"><div class="lab">Margen de seguridad</div><div class="val ${C.margenSeg<0.2?"neg":"pos"}">${isFinite(C.margenSeg)?pct(C.margenSeg):"—"}</div></div>
      <div class="tarjeta"><div class="lab">Apalancamiento operativo</div><div class="val">${isFinite(C.GAO)&&C.GAO>0?fmt(C.GAO,2):"—"}</div></div>
    </div>
    ${grafEquilibrio(C)}
  </div>
</div>

<div class="bloque">
  <h3>Reparto del equilibrio entre productos</h3>
  <div class="cuerpo sinpad tabla-wrap">
    <table>
      <thead><tr><th>Producto</th><th class="n">Participación en unidades</th><th class="n">Contribución marginal</th><th class="n">Unidades de equilibrio</th><th class="n">Ventas de equilibrio</th></tr></thead>
      <tbody>${filasPE}</tbody>
    </table>
  </div>
  <div class="cuerpo">
    ${S.productos.length>1 ? nota("","Un equilibrio, varias mezclas", `Con más de un producto el punto de equilibrio deja de ser único: depende de la <strong>mezcla de ventas</strong>. El cálculo de arriba supone que la proporción entre productos se mantiene (${S.productos.map((p,i)=>pct(C.mix[i],0)).join(" / ")}). Si se vende más del producto de menor contribución, el equilibrio se corre hacia arriba aunque las unidades totales sean las mismas.`) : ""}
    ${isFinite(C.PEproyecto) ? nota("","Equilibrio contable y equilibrio del inversor", `El punto de equilibrio de arriba solo cubre los costos del ${perLabel()}: ignora que alguien puso ${$$(C.inv0)} al inicio. Para que además se recupere esa inversión a lo largo de los ${C.n} ${perLabelPl()} harían falta <strong>${fmt(C.PEproyecto,0)} unidades en total</strong> (${fmt(C.PEproyecto/C.n,0)} por ${perLabel()}), frente a las ${fmt(C.uCiclo)} que estás proyectando.`) : ""}
    ${isFinite(C.GAO)&&C.GAO>1.05 ? nota(C.GAO>3?"amb":"","Qué significa el apalancamiento operativo", `Un apalancamiento de ${fmt(C.GAO,2)} indica que si las ventas se mueven 10 %, el resultado operativo se mueve alrededor de ${fmt(C.GAO*10,0)} %. ${C.GAO>3?"Es alto: tu estructura está muy cargada de costos fijos, así que ganás mucho al crecer y te fundís rápido al caer. Convendría analizar tercerizar, alquilar en lugar de comprar, o pasar remuneraciones a esquemas variables.":"Es un nivel manejable: el resultado no queda excesivamente expuesto a las variaciones de venta."}`) : ""}
  </div>
</div>`;
};

/* ---------- 6. Flujo de efectivo ---------- */
PANEL[7] = C => {
  const n = C.n, per = Array.from({length:n},(_,i)=>i+1);
  const fila = (t, vals, cls) => `<tr class="${cls||""}"><td>${t}</td>${vals.map(v=>`<td class="n">${v}</td>`).join("")}</tr>`;
  const cero = v => v ? `<td class="n neg">${$$(-v)}</td>` : `<td class="n">—</td>`;

  const egRows = G_COS.map(g => `<tr><td style="padding-left:18px">${g.t}</td><td class="n">—</td>${C.F.egG[g.k].map(v=>`<td class="n">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(C.F.egG[g.k]))}</td></tr>`).join("");

  return `
<div class="enc">
  <div class="eyebrow">4.7 · Flujo de efectivo</div>
  <h2>La película del dinero, período por período</h2>
  <p class="desc">Acá se ordena todo lo cargado hasta ahora en la secuencia real en la que el dinero entra y sale. La inversión se ubica en el período 0 —antes de empezar— porque es la referencia contra la cual se descuentan los flujos futuros.</p>
</div>

<div class="bloque">
  <h3>Flujo de efectivo proyectado</h3>
  <div class="cuerpo sinpad tabla-wrap">
    <table>
      <thead><tr><th>Concepto</th><th class="n">0</th>${per.map(t=>`<th class="n">${t}</th>`).join("")}<th class="n">Total</th></tr></thead>
      <tr class="grupo"><td colspan="${n+3}">Ingresos (A)</td></tr>
      <tr><td style="padding-left:18px">Ventas</td><td class="n">—</td>${C.F.filas.ingresos.map(v=>`<td class="n">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.ingresos))}</td></tr>
      <tr class="grupo"><td colspan="${n+3}">Egresos (B)</td></tr>
      <tr><td style="padding-left:18px">Activo fijo</td>${cero(C.activoFijo)}${per.map(()=>`<td class="n">—</td>`).join("")}<td class="n">${$$(C.activoFijo)}</td></tr>
      <tr><td style="padding-left:18px">Gastos pre operativos</td>${cero(C.preop)}${per.map(()=>`<td class="n">—</td>`).join("")}<td class="n">${$$(C.preop)}</td></tr>
      <tr><td style="padding-left:18px">Capital de trabajo</td>${cero(C.ctrab)}${per.map(()=>`<td class="n">—</td>`).join("")}<td class="n">${$$(C.ctrab)}</td></tr>
      ${egRows}
      <tr class="total"><td>Saldo antes de impuestos (A−B)</td><td class="n neg">${$$(-C.inv0)}</td>${C.F.filas.sai.map(v=>`<td class="n ${v<0?"neg":""}">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.sai)-C.inv0)}</td></tr>
      ${S.meta.escudo?`<tr><td style="padding-left:18px;color:var(--texto-2)">Depreciación deducible <span class="chip">no es salida de caja</span></td><td class="n">—</td>${C.F.filas.dep.map(v=>`<td class="n">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.dep))}</td></tr>`:""}
      <tr><td style="padding-left:18px">Impuestos</td><td class="n">—</td>${C.F.filas.imp.map(v=>`<td class="n">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.imp))}</td></tr>
      ${suma(C.F.filas.recup)>0?`<tr><td style="padding-left:18px">Recupero de capital de trabajo y valor residual</td><td class="n">—</td>${C.F.filas.recup.map(v=>`<td class="n pos">${v?$$(v):"—"}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.recup))}</td></tr>`:""}
      <tr class="total-mayor"><td>Saldo económico (C)</td><td class="n">${$$(-C.inv0)}</td>${C.F.filas.fn.map(v=>`<td class="n">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.fn)-C.inv0)}</td></tr>
      <tr class="total"><td>Saldo acumulado</td><td class="n">${$$(-C.inv0)}</td>${C.acumArr.map(v=>`<td class="n ${v<0?"neg":"pos"}">${$$(v)}</td>`).join("")}<td class="n"></td></tr>
      ${C.usaFin && C.montoP > 0 ? `
      <tr class="grupo"><td colspan="${n+3}">Financiamiento</td></tr>
      <tr><td style="padding-left:18px">Préstamo recibido</td><td class="n pos">${$$(C.montoP)}</td>${per.map(()=>`<td class="n">—</td>`).join("")}<td class="n">${$$(C.montoP)}</td></tr>
      ${C.gastosOt>0?`<tr><td style="padding-left:18px">Gastos de otorgamiento</td><td class="n neg">${$$(-C.gastosOt)}</td>${per.map(()=>`<td class="n">—</td>`).join("")}<td class="n">${$$(C.gastosOt)}</td></tr>`:""}
      <tr><td style="padding-left:18px">Intereses</td><td class="n">—</td>${C.interP.map(v=>`<td class="n">${v?$$(v):"—"}</td>`).join("")}<td class="n">${$$(suma(C.interP))}</td></tr>
      <tr><td style="padding-left:18px">Amortización de capital</td><td class="n">—</td>${C.amortP.map(v=>`<td class="n">${v?$$(v):"—"}</td>`).join("")}<td class="n">${$$(suma(C.amortP))}</td></tr>
      ${C.saldoFinal>0?`<tr><td style="padding-left:18px">Cancelación del saldo al cierre</td><td class="n">—</td>${per.map((t)=>`<td class="n">${t===n?$$(C.saldoFinal):"—"}</td>`).join("")}<td class="n">${$$(C.saldoFinal)}</td></tr>`:""}
      ${C.tax>0?`<tr><td style="padding-left:18px;color:var(--texto-2)">Menor impuesto por intereses</td><td class="n">—</td>${C.F.filas.imp.map((v,t)=>`<td class="n pos">${(v-C.F.filas.impF[t])>0?$$(v-C.F.filas.impF[t]):"—"}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.imp)-suma(C.F.filas.impF))}</td></tr>`:""}
      <tr class="total-mayor"><td>Saldo financiero · del inversionista (D)</td><td class="n">${$$(-C.F.Ifin)}</td>${C.F.filas.fnFin.map(v=>`<td class="n">${$$(v)}</td>`).join("")}<td class="n">${$$(suma(C.F.filas.fnFin)-C.F.Ifin)}</td></tr>
      <tr class="total"><td>Saldo financiero acumulado</td><td class="n">${$$(-C.F.Ifin)}</td>${C.acumFArr.map(v=>`<td class="n ${v<0?"neg":"pos"}">${$$(v)}</td>`).join("")}<td class="n"></td></tr>` : ""}
    </table>
  </div>
  <div class="cuerpo">
    ${grafFlujo(C)}
    ${C.F.filas.fn.some(v=>v<0) ? nota("amb","Períodos con caja negativa", `Hay ${perLabelPl()} en los que el negocio consume más de lo que genera. Eso no lo vuelve inviable, pero exige financiamiento: alguien tiene que poner ese dinero. Revisá si el capital de trabajo cargado alcanza para atravesar ese tramo sin caer en descubierto bancario, que en la Argentina es el crédito más caro que existe.`) : ""}
    ${C.usaFin && C.montoP>0 ? nota("","Dos flujos, dos preguntas distintas", `El <strong>saldo económico (C)</strong> mide el proyecto en sí mismo, como si se pagara todo al contado: responde <em>¿este negocio es bueno?</em>. El <strong>saldo financiero (D)</strong> mide lo que le queda a los socios después de atender al banco, y arranca de un desembolso mucho menor: responde <em>¿me conviene a mí entrar en este negocio con esta estructura de deuda?</em>. Son dos preguntas separadas y en el informe conviene responder las dos.`) : ""}
    ${nota("","Por qué la depreciación no figura como egreso", `La máquina se paga una vez, en el período 0, y ahí queda registrada la salida de caja. Volver a restarla como depreciación sería contarla dos veces. Su único efecto legítimo en el flujo es fiscal: al reducir la utilidad imponible reduce el impuesto a pagar${S.meta.escudo?", que es exactamente lo que está haciendo el cálculo":". Podés activar ese efecto en el paso 0"}.`)}
  </div>
</div>`;
};

/* ---------- 7. Indicadores ---------- */
PANEL[8] = C => {
  const cel = (o) => `<td class="n ${o.van<0?"neg":"pos"}">${$$(o.van)}<br><span style="font-size:11px;color:var(--texto-3)">${isFinite(o.tir)?pct(Math.pow(1+o.tir,C.k)-1,0):"—"}</span></td>`;
  const sensFilas = C.sens.map(s => `<tr><td>${s.v}</td>${cel(s.m20)}${cel(s.m10)}<td class="n" style="background:#FAFBF9">${$$(C.VAN)}</td>${cel(s.p10)}${cel(s.p20)}</tr>`).join("");
  const acot = acotaciones(C);

  return `
<div class="enc">
  <div class="eyebrow">4.8 y 4.9 · VAN, TIR y lectura del proyecto</div>
  <h2>¿Conviene hacerlo?</h2>
  <p class="desc">Los indicadores no responden si el negocio es lindo, sino si crea valor por encima de la exigencia que le pusiste. Leídos juntos —y no de a uno— cuentan una historia bastante completa.</p>
</div>

<div class="bloque">
  <h3>Indicadores de rentabilidad</h3>
  <div class="cuerpo">
    <div class="tarjetas" style="border:1px solid var(--linea)">
      <div class="tarjeta"><div class="lab">VAN</div><div class="val ${C.VAN>=0?"pos":"neg"}">${$$(C.VAN)}</div><div class="hint">a una tasa de ${pct(C.rAnual,1)} anual</div></div>
      <div class="tarjeta"><div class="lab">TIR ${S.meta.periodo==="mes"?"mensual":"anual"}</div><div class="val">${isFinite(C.TIR)?pct(C.TIR,2):"—"}</div>${S.meta.periodo==="mes"?`<div class="hint">Equivalente anual: ${isFinite(C.TIRa)?pct(C.TIRa,1):"—"}</div>`:""}</div>
      <div class="tarjeta"><div class="lab">Índice de rentabilidad</div><div class="val">${isFinite(C.IR)?fmt(C.IR,2):"—"}</div><div class="hint">Pesos de valor actual por peso invertido</div></div>
      <div class="tarjeta"><div class="lab">Recupero simple</div><div class="val">${isFinite(C.payback)?fmt(C.payback,1):"—"} <small>${perLabelPl()}</small></div></div>
      <div class="tarjeta"><div class="lab">Recupero descontado</div><div class="val">${isFinite(C.paybackD)?fmt(C.paybackD,1):"—"} <small>${perLabelPl()}</small></div></div>
      <div class="tarjeta"><div class="lab">Retorno sobre la inversión</div><div class="val">${isFinite(C.ROI)?pct(C.ROI,0):"—"}</div></div>
    </div>
    ${grafVAN(C)}
  </div>
</div>

${C.usaFin && C.montoP > 0 ? `
<div class="bloque">
  <h3>Rentabilidad del inversionista <span class="chip">Después de pagarle al banco</span></h3>
  <div class="cuerpo">
    <div class="tarjetas" style="border:1px solid var(--linea)">
      <div class="tarjeta"><div class="lab">Aporte propio</div><div class="val">${$$(C.F.Ifin)}</div><div class="hint">Inversión menos préstamo, más gastos</div></div>
      <div class="tarjeta"><div class="lab">VAN financiero</div><div class="val ${C.VANF>=0?"pos":"neg"}">${$$(C.VANF)}</div><div class="hint">exigiendo ${pct(C.kE,1)} al capital propio</div></div>
      <div class="tarjeta"><div class="lab">TIR del inversionista</div><div class="val ${isFinite(C.TIRFa)&&C.TIRFa>C.kE?"pos":"neg"}">${isFinite(C.TIRFa)?pct(C.TIRFa,1):"—"}</div><div class="hint">anual</div></div>
      <div class="tarjeta"><div class="lab">Recupero del aporte</div><div class="val">${isFinite(C.paybackF)?fmt(C.paybackF,1):"—"} <small>${perLabelPl()}</small></div></div>
      <div class="tarjeta"><div class="lab">Cobertura mínima de cuota</div><div class="val ${C.dscrMin<1.2?"neg":"pos"}">${isFinite(C.dscrMin)?fmt(C.dscrMin,2):"—"}</div></div>
    </div>
    ${(function(){
      const ke = isFinite(C.TIRFa), pos = isFinite(C.TIRa) && C.TIRa > C.kD;
      if (!isFinite(C.TIRa)) return "";
      return nota(pos?"ok":"amb", pos?"El apalancamiento juega a favor":"El apalancamiento juega en contra",
        pos
        ? `El proyecto rinde ${pct(C.TIRa,1)} anual y el crédito cuesta ${pct(C.kD,1)} después del ahorro de impuestos. Como la rentabilidad supera al costo de la deuda, cada peso prestado deja una diferencia que se la llevan los socios: por eso la TIR del inversionista (${isFinite(C.TIRFa)?pct(C.TIRFa,1):"—"}) es mayor que la del proyecto. Esa es toda la magia del apalancamiento financiero, y también su peligro: amplifica el resultado en los dos sentidos. Si las ventas se caen, la cuota sigue llegando igual.`
        : `El proyecto rinde ${pct(C.TIRa,1)} anual y el crédito cuesta ${pct(C.kD,1)}. Estás pagando por el dinero más de lo que el negocio es capaz de generar con él: cada peso prestado erosiona el resultado de los socios en lugar de mejorarlo. Con estas condiciones conviene financiar con capital propio, negociar una tasa más baja o una línea subsidiada, o directamente revisar si el proyecto se sostiene.`);
    })()}
    ${C.F.Ifin <= 0 ? nota("amb","Sin capital propio en juego", "El préstamo cubre toda la inversión, así que el aporte propio es cero o negativo y la TIR del inversionista pierde sentido matemático: no se puede calcular el rendimiento de algo que no se puso. En la práctica ninguna entidad financia el 100 %: suelen exigir entre un 20 % y un 30 % de aporte propio, justamente para que el emprendedor tenga algo que perder.") : ""}
  </div>
</div>` : ""}

<div class="bloque">
  <h3>Qué pasa si me equivoqué <span class="chip">Análisis de sensibilidad</span></h3>
  <div class="cuerpo sinpad tabla-wrap">
    <table>
      <thead><tr><th>Si esta variable cambia…</th><th class="n">−20 %</th><th class="n">−10 %</th><th class="n">Escenario base</th><th class="n">+10 %</th><th class="n">+20 %</th></tr></thead>
      <tbody>${sensFilas}</tbody>
    </table>
  </div>
  <div class="cuerpo">
    <p class="hint" style="margin:0">Cada celda muestra el VAN resultante y, debajo, la TIR anual equivalente. La fila que más cambia el VAN es la variable crítica del proyecto: es donde hay que concentrar el esfuerzo de investigación, la negociación con proveedores y el control de gestión una vez que el negocio esté andando.</p>
  </div>
</div>

<div class="bloque">
  <h3>Lectura del proyecto</h3>
  <div class="cuerpo">
    <div class="notas-lista">${acot.map(a=>nota(a.c,a.et,a.t)).join("")}</div>
  </div>
</div>`;
};

/* ============================================================
   GRÁFICOS (SVG generado a mano, sin librerías)
   ============================================================ */
const W=740, H=300, ML=72, MR=16, MT=16, MB=36;
const PW = W-ML-MR, PH = H-MT-MB;
function ejes(xt, yt, xlab, ylab){
  let s = `<line x1="${ML}" y1="${MT+PH}" x2="${ML+PW}" y2="${MT+PH}" stroke="#152430" stroke-width="1"/>`;
  s += `<line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT+PH}" stroke="#152430" stroke-width="1"/>`;
  xt.forEach(t => { s += `<line x1="${t.x}" y1="${MT+PH}" x2="${t.x}" y2="${MT+PH+4}" stroke="#8A979D"/><text x="${t.x}" y="${MT+PH+16}" text-anchor="middle">${t.l}</text>`; });
  yt.forEach(t => { s += `<line x1="${ML-4}" y1="${t.y}" x2="${ML+PW}" y2="${t.y}" stroke="#EBEFE9"/><text x="${ML-8}" y="${t.y+3}" text-anchor="end">${t.l}</text>`; });
  s += `<text x="${ML+PW}" y="${MT+PH+30}" text-anchor="end" fill="#8A979D">${xlab}</text>`;
  s += `<text x="${ML-58}" y="${MT-4}" fill="#8A979D">${ylab}</text>`;
  return s;
}
const kfmt = v => Math.abs(v)>=1e6 ? fmt(v/1e6,1)+"M" : Math.abs(v)>=1e3 ? fmt(v/1e3,0)+"k" : fmt(v,0);

function grafEquilibrio(C){
  if (!(C.MCpond > 0) || !isFinite(C.PEq)) return nota("amb","Sin gráfico", "Para dibujar el punto de equilibrio hace falta que la contribución marginal ponderada sea positiva: el precio tiene que superar al costo variable unitario.");
  const CVUp = C.Ppond - C.MCpond;
  const xmax = Math.max(C.PEq*1.8, C.uProm*1.3, 1);
  const ymax = Math.max(C.Ppond*xmax, C.CF + CVUp*xmax) * 1.06 || 1;
  const X = q => ML + (q/xmax)*PW, Y = v => MT + PH - (v/ymax)*PH;
  const xt = [0,.25,.5,.75,1].map(f=>({x:X(xmax*f), l:fmt(xmax*f,0)}));
  const yt = [0,.25,.5,.75,1].map(f=>({y:Y(ymax*f), l:kfmt(ymax*f)}));
  const px = X(C.PEq), py = Y(C.PEq*C.Ppond);
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico del punto de equilibrio">
    <polygon points="${ML},${Y(0)} ${px},${py} ${px},${Y(C.CF)} ${ML},${Y(C.CF)}" fill="#C0402F" opacity="0.10"/>
    <polygon points="${px},${py} ${X(xmax)},${Y(C.Ppond*xmax)} ${X(xmax)},${Y(C.CF+CVUp*xmax)} ${px},${py}" fill="#2E8F5B" opacity="0.14"/>
    ${ejes(xt,yt,"unidades por "+perLabel(), S.meta.moneda)}
    <line x1="${ML}" y1="${Y(C.CF)}" x2="${X(xmax)}" y2="${Y(C.CF)}" stroke="#8A979D" stroke-dasharray="4 3"/>
    <line x1="${ML}" y1="${Y(C.CF)}" x2="${X(xmax)}" y2="${Y(C.CF+CVUp*xmax)}" stroke="#C0402F" stroke-width="2"/>
    <line x1="${ML}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(C.Ppond*xmax)}" stroke="#0E93D0" stroke-width="2"/>
    <line x1="${px}" y1="${py}" x2="${px}" y2="${MT+PH}" stroke="#152430" stroke-dasharray="3 3"/>
    <circle cx="${px}" cy="${py}" r="4.5" fill="#152430"/>
    <text x="${px+8}" y="${py-8}" fill="#152430" font-weight="600">PE · ${fmt(C.PEq,0)} u · ${$$(C.PE$)}</text>
    <text x="${X(xmax)-4}" y="${Y(C.Ppond*xmax)+14}" text-anchor="end" fill="#0E93D0">ingresos</text>
    <text x="${X(xmax)-4}" y="${Y(C.CF+CVUp*xmax)-8}" text-anchor="end" fill="#C0402F">costo total</text>
    <text x="${ML+6}" y="${Y(C.CF)-6}" fill="#8A979D">costo fijo</text>
  </svg>`;
}

function grafFlujo(C){
  const vals = [-C.inv0].concat(C.F.filas.fn);
  const ac = [-C.inv0].concat(C.acumArr);
  const lo = Math.min(0, ...vals, ...ac), hi = Math.max(0, ...vals, ...ac);
  const rango = (hi-lo) || 1;
  const Y = v => MT + PH - ((v-lo)/rango)*PH;
  const bw = PW/vals.length;
  const yt = [0,.25,.5,.75,1].map(f=>({y:Y(lo+rango*f), l:kfmt(lo+rango*f)}));
  const xt = vals.map((_,i)=>({x:ML+bw*(i+.5), l:i})).filter((_,i)=> vals.length<=14 || i%2===0);
  const barras = vals.map((v,i)=>{
    const y0 = Y(0), y1 = Y(v);
    return `<rect x="${ML+bw*i+bw*0.18}" y="${Math.min(y0,y1)}" width="${bw*0.64}" height="${Math.abs(y1-y0)||1}" fill="${v<0?"#C0402F":"#0E93D0"}" opacity="0.85"/>`;
  }).join("");
  const linea = ac.map((v,i)=>`${ML+bw*(i+.5)},${Y(v)}`).join(" ");
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Flujo de fondos por período">
    ${ejes(xt,yt,"período", S.meta.moneda)}
    ${barras}
    <line x1="${ML}" y1="${Y(0)}" x2="${ML+PW}" y2="${Y(0)}" stroke="#152430" stroke-width="1"/>
    <polyline points="${linea}" fill="none" stroke="#C8871A" stroke-width="2"/>
    <text x="${ML+PW-4}" y="${MT+12}" text-anchor="end" fill="#C8871A">saldo acumulado</text>
  </svg>`;
}

function grafVAN(C){
  if (C.inv0 <= 0) return nota("amb","Sin gráfico","Cargá el plan de inversión para poder trazar el perfil del VAN.");
  const rmax = Math.max(0.6, isFinite(C.TIRa)?C.TIRa*1.7:0, C.rAnual*2.2);
  const pts = [];
  for (let i=0;i<=60;i++){
    const ra = rmax*i/60;
    const rp = Math.pow(1+ra, 1/C.k) - 1;
    pts.push([ra, C.van(C.F.filas.fn, C.F.I, rp)]);
  }
  const vs = pts.map(p=>p[1]);
  const hi = Math.max(...vs, 0), lo = Math.min(...vs, 0), rango = (hi-lo)||1;
  const X = r => ML + (r/rmax)*PW, Y = v => MT + PH - ((v-lo)/rango)*PH;
  const xt = [0,.25,.5,.75,1].map(f=>({x:X(rmax*f), l:fmt(rmax*f*100,0)+"%"}));
  const yt = [0,.25,.5,.75,1].map(f=>({y:Y(lo+rango*f), l:kfmt(lo+rango*f)}));
  const curva = pts.map(p=>`${X(p[0])},${Y(p[1])}`).join(" ");
  let marcas = `<line x1="${ML}" y1="${Y(0)}" x2="${ML+PW}" y2="${Y(0)}" stroke="#152430"/>`;
  if (C.rAnual<=rmax) marcas += `<line x1="${X(C.rAnual)}" y1="${MT}" x2="${X(C.rAnual)}" y2="${MT+PH}" stroke="#0E93D0" stroke-dasharray="4 3"/><text x="${X(C.rAnual)+6}" y="${MT+12}" fill="#0E93D0">tu tasa ${pct(C.rAnual,0)}</text>`;
  if (isFinite(C.TIRa) && C.TIRa<=rmax && C.TIRa>=0) marcas += `<circle cx="${X(C.TIRa)}" cy="${Y(0)}" r="4.5" fill="#C8871A"/><text x="${X(C.TIRa)+8}" y="${Y(0)-8}" fill="#C8871A" font-weight="600">TIR ${pct(C.TIRa,1)}</text>`;
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil del VAN según la tasa de descuento">
    ${ejes(xt,yt,"tasa de descuento anual", "VAN en "+S.meta.moneda)}
    <polyline points="${curva}" fill="none" stroke="#152430" stroke-width="2"/>
    ${marcas}
  </svg>`;
}

/* ============================================================
   ACOTACIONES AUTOMÁTICAS
   ============================================================ */
function acotaciones(C){
  const A = [];
  const sinDatos = C.inv0 <= 0 || C.uCiclo <= 0 || (C.CF + C.CV) <= 0;
  if (sinDatos){
    A.push({c:"amb", et:"Falta información", t:`Todavía no hay datos suficientes para juzgar el proyecto. Verificá que estén cargados: ${C.uCiclo<=0?"<strong>las unidades a vender</strong>, ":""}${C.inv0<=0?"<strong>la inversión inicial</strong>, ":""}${(C.CF+C.CV)<=0?"<strong>la estructura de costos</strong>, ":""}y que los precios sean mayores a cero.`});
    return A;
  }

  /* veredicto principal */
  if (C.VAN > 0 && isFinite(C.TIRa) && C.TIRa > C.rAnual){
    A.push({c:"ok", et:"Conviene hacerlo", t:`El VAN de ${$$(C.VAN)} significa que, después de devolver los ${$$(C.inv0)} invertidos y de pagarle a esa plata un rendimiento del ${pct(C.rAnual,1)} anual, todavía sobra ese valor expresado en dinero de hoy. La TIR de ${pct(C.TIRa,1)} anual supera la exigencia en ${pct(C.TIRa-C.rAnual,1)}: ese diferencial es el colchón que tenés antes de que el proyecto deje de ser conveniente. Cada peso invertido devuelve ${fmt(C.IR,2)} pesos de valor actual.`});
  } else if (C.VAN > 0){
    A.push({c:"", et:"Positivo pero revisar", t:`El VAN da ${$$(C.VAN)}, aunque la TIR no resulta comparable de manera limpia —suele pasar cuando el flujo cambia de signo más de una vez o cuando hay recuperos grandes al final—. En esos casos el criterio a seguir es el VAN, que no tiene ese problema.`});
  } else {
    const fp = C.quiebre("precio"), fu = C.quiebre("unid"), fc = C.quiebre("cv");
    let camino = "";
    if (isFinite(fp) || isFinite(fu) || isFinite(fc)){
      const op = [];
      if (isFinite(fp) && fp>1) op.push(`subir el precio un <strong>${fmt((fp-1)*100,1)} %</strong>`);
      if (isFinite(fu) && fu>1) op.push(`vender un <strong>${fmt((fu-1)*100,1)} %</strong> más de unidades`);
      if (isFinite(fc) && fc<1) op.push(`bajar los costos variables un <strong>${fmt((1-fc)*100,1)} %</strong>`);
      if (op.length) camino = ` Para llegar al menos al punto de indiferencia harían falta, tomando cada camino por separado: ${op.join(", ")}. Preguntate cuál de esos números es defendible frente a la investigación de mercado que hiciste.`;
    }
    A.push({c:"mal", et:"Así no cierra", t:`El VAN es ${$$(C.VAN)}. En dinero de hoy, el proyecto devuelve menos que lo que cuesta ponerlo en marcha exigiéndole ${pct(C.rAnual,1)} anual. ${isFinite(C.TIRa)?`Su rendimiento real es del ${pct(C.TIRa,1)} anual, por debajo de esa exigencia.`:"Los flujos no alcanzan a devolver la inversión en el horizonte analizado."}${camino}`});
  }

  /* recupero */
  if (!isFinite(C.payback)) A.push({c:"amb", et:"No se recupera", t:`En los ${C.n} ${perLabelPl()} analizados el saldo acumulado nunca vuelve a cruzar el cero: la inversión no llega a recuperarse dentro del horizonte. O el horizonte es demasiado corto para la naturaleza del negocio, o la escala proyectada no da.`});
  else if (isFinite(C.paybackD)) A.push({c:"", et:"Tiempo de recupero", t:`La inversión se recupera en ${fmt(C.payback,1)} ${perLabelPl()} sin descontar, y en ${fmt(C.paybackD,1)} ${perLabelPl()} considerando el valor del dinero en el tiempo. La diferencia entre ambos números es el costo de esperar. ${C.paybackD > C.n*0.75 ? "Recuperar recién sobre el final del horizonte deja muy poco margen: cualquier desvío se come el resultado." : "Recuperar dentro de la primera mitad del horizonte es una señal de solidez."}`});

  /* margen de seguridad */
  if (isFinite(C.margenSeg)){
    if (C.margenSeg < 0) A.push({c:"mal", et:"Por debajo del equilibrio", t:`Las ventas proyectadas (${$$(C.ventasProm)} por ${perLabel()}) no llegan al punto de equilibrio de ${$$(C.PE$)}. El emprendimiento pierde plata en la operación corriente, incluso ignorando la inversión inicial.`});
    else if (C.margenSeg < 0.2) A.push({c:"amb", et:"Margen de seguridad estrecho", t:`Solo un ${pct(C.margenSeg)} separa tus ventas proyectadas del punto de equilibrio. Una caída de esa magnitud —perfectamente posible en el primer año de cualquier emprendimiento— te deja en cero. Conviene revisar la estructura de costos fijos antes que confiar en que la proyección de ventas se va a cumplir.`});
    else A.push({c:"ok", et:"Margen de seguridad", t:`Las ventas pueden caer hasta un ${pct(C.margenSeg)} antes de tocar el punto de equilibrio. Ese colchón es lo que le da al proyecto tolerancia frente a un año malo, un competidor nuevo o una estimación optimista.`});
  }

  /* variable crítica */
  const crit = C.sens.map(s => ({v:s.v, d:Math.abs(s.p10.van - s.m10.van)})).sort((a,b)=>b.d-a.d)[0];
  if (crit && crit.d > 0) A.push({c:"", et:"Variable crítica", t:`De todas las variables, <strong>${crit.v.toLowerCase()}</strong> es la que más mueve el resultado: un desvío de ±10 % modifica el VAN en ${$$(crit.d)}. Es el número que más te conviene tener bien fundamentado en el informe, y el primero que deberías monitorear si el emprendimiento se pone en marcha.`});

  /* TIR sospechosa */
  if (isFinite(C.TIRa) && C.TIRa > 2) A.push({c:"amb", et:"Una TIR demasiado buena", t:`Un rendimiento anual del ${pct(C.TIRa,0)} es extraordinario y, en la práctica, casi siempre es señal de que falta algo en el cálculo. Los sospechosos habituales: no haberse asignado un sueldo, olvidar el alquiler o el uso de un inmueble propio, subestimar el capital de trabajo, ignorar cargas sociales, seguros, mantenimiento, mermas y roturas, o no considerar impuestos. Si después de revisar todo eso el número se sostiene, entonces la pregunta es por qué nadie más lo está haciendo.`});

  /* estructura de costos */
  const pesoFijo = (C.CF+C.CV) > 0 ? C.CF/(C.CF+C.CV) : 0;
  if (pesoFijo > 0.6) A.push({c:"amb", et:"Estructura pesada", t:`Los costos fijos representan el ${pct(pesoFijo)} de tus costos operativos. Una estructura así necesita volumen sí o sí para diluirse, y castiga fuerte los períodos flojos. En proyectos que arrancan suele ser preferible empezar liviano: alquilar en lugar de comprar, tercerizar etapas, trabajar a fasón, y recién invertir en estructura propia cuando la demanda esté probada.`});

  /* impuestos y realismo */
  if (C.tax === 0) A.push({c:"amb", et:"Sin carga impositiva", t:`El cálculo está hecho con impuesto cero sobre la ganancia. Si el emprendimiento va a funcionar formalmente, corresponde incorporar al menos el monotributo o el impuesto a las ganancias, más ingresos brutos provinciales y las tasas municipales, que se pagan aunque el resultado sea negativo. Un proyecto que solo cierra en la informalidad no es un proyecto, es un problema postergado.`});

  /* horizonte */
  if (C.n < 12 && S.meta.periodo === "mes") A.push({c:"", et:"Horizonte corto", t:`Estás evaluando ${C.n} ${perLabelPl()}. Un horizonte menor a un año no permite ver la estacionalidad completa ni darle tiempo al negocio a alcanzar su régimen. Salvo que se trate de un emprendimiento de temporada, conviene extenderlo.`});

  /* valor residual */
  if (num(S.meta.residual) === 0 && C.depreciable > 0) A.push({c:"", et:"Los fierros valen algo", t:`Cerrás el análisis suponiendo que los equipos no valen nada al final. Si el horizonte es corto frente a la vida útil real de las máquinas, eso subestima el resultado: al cabo de ${C.n} ${perLabelPl()} un equipo bien mantenido conserva una parte importante de su valor. Podés cargar ese porcentaje en el paso 0.`});

  /* inflación */
  A.push({c:"", et:"Una advertencia sobre la moneda", t:`Todo el análisis está expresado en moneda constante: los precios de hoy se mantienen a lo largo del horizonte. Es la forma correcta de trabajar en un contexto inflacionario, siempre que la tasa de descuento también sea real. El riesgo aparece cuando los precios de venta y los costos no se ajustan al mismo ritmo —típicamente los costos corren más rápido—: si eso pasa, el margen se erosiona sin que la planilla lo muestre. Ese punto merece mencionarse explícitamente en las conclusiones del informe.`});

  return A;
}

/* ============================================================
   CINTA DE RESULTADOS
   ============================================================ */
function cinta(C){
  let clase = "tibio", et = "Resultado provisorio", txt = "Cargá inversión, unidades y costos para obtener un veredicto.";
  const listo = C.inv0 > 0 && C.uCiclo > 0 && (C.CF+C.CV) > 0;
  if (listo){
    if (C.VAN > 0 && isFinite(C.TIRa) && C.TIRa > C.rAnual){
      clase = ""; et = "Crea valor";
      txt = `Rinde ${pct(C.TIRa-C.rAnual,1)} por encima de lo que le exigís. Cada peso invertido vuelve como ${fmt(C.IR,2)}.`;
    } else if (C.VAN > 0){ clase=""; et="VAN positivo"; txt = "Supera la exigencia, aunque la TIR no es concluyente. Guiate por el VAN."; }
    else { clase = "malo"; et = "Destruye valor"; txt = `Faltan ${$$(-C.VAN)} de valor actual para justificar la inversión a una tasa del ${pct(C.rAnual,1)}.`; }
  }
  return `
  <div class="tit"><span>Resultados en vivo</span><span>${esc(S.meta.nombre||"sin título")}</span></div>
  <div class="ind"><div class="lab">VAN</div><div class="val ${listo?(C.VAN>=0?"pos":"neg"):""}">${$$(C.VAN)}</div><div class="nota">Valor creado, medido en dinero de hoy</div></div>
  <div class="ind"><div class="lab">TIR anual</div><div class="val ${isFinite(C.TIRa)&&C.TIRa>C.rAnual?"pos":"neg"}">${isFinite(C.TIRa)?pct(C.TIRa,1):"—"}</div><div class="nota">Exigencia: ${pct(C.rAnual,1)}</div></div>
  <div class="ind"><div class="lab">Punto de equilibrio</div><div class="val chico">${isFinite(C.PEq)?fmt(C.PEq,0)+" u":"—"}</div><div class="val chico">${$$(C.PE$)}</div><div class="nota">por ${perLabel()}</div></div>
  <div style="margin:14px 0 4px">
    <div class="reng"><span>Inversión inicial</span><b>${$$(C.inv0)}</b></div>
    <div class="reng"><span>Costo total unitario</span><b>${S.productos.length===1?$$(C.CTU[0],2):"varios"}</b></div>
    <div class="reng"><span>Contribución marginal</span><b>${$$(C.MCpond,2)}</b></div>
    <div class="reng"><span>Margen de seguridad</span><b class="${C.margenSeg<0.2?"neg":"pos"}">${isFinite(C.margenSeg)?pct(C.margenSeg):"—"}</b></div>
    <div class="reng"><span>Recupero descontado</span><b>${isFinite(C.paybackD)?fmt(C.paybackD,1)+" "+perLabelPl():"—"}</b></div>
    <div class="reng"><span>Índice de rentabilidad</span><b>${isFinite(C.IR)?fmt(C.IR,2):"—"}</b></div>
  </div>
  ${C.usaFin && C.montoP>0 ? `
  <div class="tit" style="margin-top:16px"><span>Con el crédito</span><span>${pct(C.wD,0)} banco</span></div>
  <div class="ind"><div class="lab">VAN del inversionista</div><div class="val chico ${C.VANF>=0?"pos":"neg"}">${$$(C.VANF)}</div><div class="nota">Después de pagarle al banco, exigiendo ${pct(C.kE,1)}</div></div>
  <div style="margin:10px 0 4px">
    <div class="reng"><span>Aporte propio</span><b>${$$(C.F.Ifin)}</b></div>
    <div class="reng"><span>Cuota por ${perLabel()}</span><b>${$$(C.cuotaTipo)}</b></div>
    <div class="reng"><span>TIR del inversionista</span><b class="${isFinite(C.TIRFa)&&C.TIRFa>C.kE?"pos":"neg"}">${isFinite(C.TIRFa)?pct(C.TIRFa,1):"—"}</b></div>
    <div class="reng"><span>Cobertura de la cuota</span><b class="${C.dscrMin<1.2?"neg":"pos"}">${isFinite(C.dscrMin)?fmt(C.dscrMin,2):"—"}</b></div>
  </div>` : ""}
  <div class="veredicto ${clase}"><b>${et}</b>${txt}</div>`;
}

/* ============================================================
   RENDER Y EVENTOS
   ============================================================ */
let TODOS = false;
function imprimir(){
  TODOS = true; render();
  setTimeout(()=>{ window.print(); TODOS = false; render(); }, 80);
}
window.addEventListener("beforeprint", ()=>{ if (!TODOS){ TODOS = true; render(); } });
window.addEventListener("afterprint", ()=>{ TODOS = false; render(); });

function render(){
  normaliza();
  const foco = document.activeElement;
  const fk = foco && foco.dataset ? foco.dataset.k : null;
  const fs = foco && foco.selectionStart !== undefined ? foco.selectionStart : null;

  const C = calcular();
  const faltan = [];
  if (C.uCiclo <= 0) faltan.push(1);
  if (C.inv0 <= 0) faltan.push(2);
  if ((C.CF + C.CV) <= 0) faltan.push(4);

  $("#pasos").innerHTML = PASOS.map((p,i)=>
    `<li class="paso ${i===S.paso?"on":""} ${faltan.indexOf(i)>-1?"alerta":""}" data-act="ir" data-i="${i}"><span class="n">${p.n}</span><span>${p.t}</span></li>`).join("");
  const hoy = new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
  $("#work").innerHTML = `<header class="solo-print"><h1>Estudio económico · ${esc(S.meta.nombre||"Proyecto sin título")}</h1><div class="met">${esc(S.meta.autor||"")} · UNCAUS · Marketing e Investigación de Mercados · ${hoy}</div></header>` + PASOS.map((p,i)=>`<section class="panel ${i===S.paso?"on":""}">${(TODOS||i===S.paso)?PANEL[i](C):""}</section>`).join("") +
    `<div class="acciones no-print">
       ${S.paso>0?`<button data-act="ir" data-i="${S.paso-1}">← ${PASOS[S.paso-1].t}</button>`:""}
       ${S.paso<PASOS.length-1?`<button class="primario" data-act="ir" data-i="${S.paso+1}">${PASOS[S.paso+1].t} →</button>`:`<button class="primario" data-act="imprimir">Imprimir el trabajo completo</button>`}
     </div>`;
  $("#cinta").innerHTML = cinta(C);

  if (fk){
    const el = document.querySelector(`[data-k="${fk}"]`);
    if (el){ el.focus(); if (fs !== null && el.setSelectionRange) { try { el.setSelectionRange(fs,fs); } catch(e){} } }
  }
}

document.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.k) return;
  setPath(el.dataset.k, el.dataset.tipo === "bool" ? el.checked : el.value);
  render();
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act, i = Number(b.dataset.i), g = b.dataset.g;
  switch(a){
    case "ir": S.paso = i; render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    case "addProd": S.productos.push(prodNuevo()); render(); break;
    case "delProd": {
      const id = S.productos[i].id;
      S.productos.splice(i,1);
      S.costos.forEach(c => { if (c.prod === id) c.prod = ""; });
      render(); break;
    }
    case "addInv": S.inversion.push({id:uid(), grupo:g, detalle:"", vu:"", cant:"1"}); render(); break;
    case "delInv": S.inversion.splice(i,1); render(); break;
    case "addCos": {
      const sug = (G_COS.find(x=>x.k===g)||{}).sug || "V";
      S.costos.push({id:uid(), grupo:g, detalle:"", vu:"", cant:"1", tipo:sug, prod:""}); render(); break;
    }
    case "delCos": S.costos.splice(i,1); render(); break;
    case "serie": {
      const p = S.productos[ent(S._serie.prod)] || S.productos[0];
      const base = num(S._serie.base), cr = num(S._serie.crec)/100;
      const n = clamp(ent(S.meta.n)||1,1,60);
      for (let t=0;t<n;t++) p.u[t] = String(Math.round(base*Math.pow(1+cr,t)));
      render(); break;
    }
    case "imprimir": imprimir(); break;
    case "guardar": guardar(); break;
    case "abrir": $("#fileIn").click(); break;
    case "ejemplo": if (confirm("Se va a reemplazar lo que tengas cargado por un caso de ejemplo. ¿Seguimos?")) { S = ejemplo(); render(); } break;
    case "limpiar": if (confirm("Esto borra todos los datos cargados. ¿Seguimos?")) { S = vacio(); render(); } break;
  }
});

function guardar(){
  const nombre = (S.meta.nombre || "estudio-economico").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre + ".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
$("#fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !d.meta || !Array.isArray(d.productos)) throw 0;
      const base = vacio();
      S = Object.assign(base, d);
      S.meta = Object.assign(base.meta, d.meta || {});
      S.meta.fin = Object.assign(vacio().meta.fin, (d.meta && d.meta.fin) || {});
      S._serie = S._serie || {prod:0, base:"", crec:""};
      render();
    } catch(err){ alert("Ese archivo no tiene el formato del estudio económico. Elegí un .json guardado desde esta misma aplicación."); }
    e.target.value = "";
  };
  rd.readAsText(f);
});

window.addEventListener("beforeunload", e => {
  if (S.inversion.length || S.costos.length || S.meta.nombre){ e.preventDefault(); e.returnValue = ""; }
});

/* ---------- caso de ejemplo ---------- */
function ejemplo(){
  const E = vacio();
  E.meta = { nombre:"Cervecería artesanal", autor:"Ejemplo cargado", moneda:"$", periodo:"mes", n:24,
             tasa:"35", imp:"21", ref:1, recuperaCT:true, residual:"20", escudo:true, vida:"10",
             fin:{ usa:true, monto:"12000000", tasa:"45", plazo:"36", gracia:"3", gastos:"2",
                   sistema:"frances", ke:"45" } };
  const p = prodNuevo(); p.nombre = "Cerveza artesanal 500 cc"; p.markup = "55"; p.modo = "auto";
  for (let t=0;t<24;t++) p.u.push(String(Math.round(1200*Math.pow(1.03,t))));
  E.productos = [p];
  const inv = (grupo,detalle,vu,cant) => E.inversion.push({id:uid(),grupo,detalle,vu:String(vu),cant:String(cant)});
