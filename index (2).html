<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio Económico · Plan de Negocios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0E2233;
  --tinta-2:#1B3A52;
  --papel:#F4F6F2;
  --blanco:#FFFFFF;
  --cian:#0E93D0;
  --cian-d:#0A6A97;
  --verde:#2E8F5B;
  --verde-l:#E7F3EC;
  --rojo:#C0402F;
  --rojo-l:#FBEBE8;
  --ambar:#C8871A;
  --ambar-l:#FDF3E0;
  --linea:#D9DFD8;
  --linea-2:#EBEFE9;
  --texto:#152430;
  --texto-2:#5E6E77;
  --texto-3:#8A979D;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:4px;
  --sombra:0 1px 2px rgba(14,34,51,.06), 0 8px 24px -16px rgba(14,34,51,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--texto);
  background:var(--papel);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
p{margin:0 0 .7em}
a{color:var(--cian-d)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 330px;min-height:100vh}

/* ---------- Riel de navegación ---------- */
.rail{
  background:var(--tinta);color:#CBD8E0;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.marca{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.marca .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5E86A0}
.marca h1{color:#fff;font-size:17px;line-height:1.25;margin-top:6px}
.marca .sub{font-size:12px;color:#7E9AAC;margin-top:5px;line-height:1.35}
.pasos{list-style:none;margin:0;padding:10px 0;flex:1}
.paso{
  display:grid;grid-template-columns:38px 1fr;align-items:baseline;gap:2px;
  padding:9px 16px 9px 10px;cursor:pointer;border-left:3px solid transparent;
  color:#A8BECC;font-size:13.5px;
}
.paso .n{font-family:var(--mono);font-size:11px;color:#5E86A0;letter-spacing:.04em}
.paso:hover{background:rgba(255,255,255,.05);color:#E6EEF3}
.paso.on{background:rgba(14,147,208,.16);border-left-color:var(--cian);color:#fff;font-weight:500}
.paso.on .n{color:var(--cian)}
.paso.alerta .n::after{content:"•";color:var(--ambar);margin-left:4px}
.rail-pie{padding:12px 14px 18px;border-top:1px solid rgba(255,255,255,.09);display:grid;gap:7px}
.rail-pie .mini{font-family:var(--mono);font-size:10px;color:#5E86A0;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1px}

/* ---------- Área de trabajo ---------- */
.work{padding:30px 34px 90px;max-width:1080px;min-width:0}
.enc{border-bottom:2px solid var(--tinta);padding-bottom:12px;margin-bottom:22px}
.enc .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cian-d)}
.enc h2{font-size:26px;margin-top:5px}
.enc .desc{color:var(--texto-2);font-size:14px;margin-top:7px;max-width:70ch}
.panel{display:none}
.panel.on{display:block;animation:entra .22s ease}
@keyframes entra{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.bloque{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);margin-bottom:20px}
.bloque > h3{
  font-size:12px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--tinta);padding:11px 14px;border-bottom:1px solid var(--linea-2);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.bloque .cuerpo{padding:14px}
.bloque .cuerpo.sinpad{padding:0}

/* ---------- Formularios ---------- */
.grid{display:grid;gap:12px 14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
label.campo{display:block}
label.campo > span{
  display:block;font-size:11px;font-family:var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--texto-2);margin-bottom:4px;
}
input,select{
  width:100%;font-family:var(--sans);font-size:14px;color:var(--texto);
  border:1px solid var(--linea);border-radius:3px;padding:7px 9px;background:#fff;
}
input.num,input[data-num]{font-family:var(--mono);text-align:right;font-size:13.5px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cian);outline-offset:1px;border-color:var(--cian)}
input[readonly]{background:#F7F9F6;color:var(--texto-2)}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--texto)}
.check input{width:auto;margin-top:3px}
.hint{font-size:12px;color:var(--texto-3);margin-top:4px;line-height:1.4}

/* ---------- Botones ---------- */
button{
  font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--linea);background:#fff;color:var(--texto);
  padding:6px 11px;border-radius:3px;transition:background .12s,border-color .12s;
}
button:hover{background:#F2F5F0;border-color:#BFC9BE}
button.primario{background:var(--tinta);color:#fff;border-color:var(--tinta)}
button.primario:hover{background:var(--tinta-2)}
button.ghost{border-color:transparent;background:transparent;color:var(--cian-d);padding:4px 6px}
button.ghost:hover{background:#EAF4FA}
button.mini{font-size:11px;padding:3px 7px}
button.x{border:none;background:none;color:var(--texto-3);font-size:16px;line-height:1;padding:2px 5px}
button.x:hover{color:var(--rojo);background:var(--rojo-l)}
.rail button{width:100%;background:rgba(255,255,255,.07);color:#D7E3EA;border-color:rgba(255,255,255,.14);text-align:left}
.rail button:hover{background:rgba(255,255,255,.14)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- Tablas ---------- */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--linea-2);text-align:left;vertical-align:middle}
thead th{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--texto-2);font-weight:500;background:#FAFBF9;border-bottom:1px solid var(--linea);
  position:sticky;top:0;white-space:nowrap;
}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grupo td{
  background:#F2F6F8;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tinta);font-weight:600;
}
tr.total td{font-weight:600;background:#FAFBF9;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
tr.total-mayor td{background:var(--tinta);color:#fff;font-weight:600;border:none}
tr.sub td{background:#FBFCFA;font-weight:500}
table input{padding:4px 7px;font-size:13px;border-color:#E4E9E3}
table input:hover{border-color:var(--linea)}
table select{padding:4px 6px;font-size:12.5px}
td.acc{width:32px;text-align:center}
.pos{color:var(--verde)}
.neg{color:var(--rojo)}

/* ---------- Cinta de resultados ---------- */
.tape{padding:24px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;background:#EDF0EB;border-left:1px solid var(--linea)}
.cinta{background:#fff;box-shadow:var(--sombra);position:relative;padding:16px 16px 22px}
.cinta::after{
  content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:#fff;
  -webkit-mask:repeating-linear-gradient(135deg,#000 0 6px,transparent 6px 12px);
  mask:repeating-linear-gradient(135deg,#000 0 6px,transparent 6px 12px);
}
.cinta .tit{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--texto-3);border-bottom:1px dashed var(--linea);padding-bottom:8px;margin-bottom:12px;
  display:flex;justify-content:space-between;
}
.ind{margin-bottom:13px}
.ind .lab{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2)}
.ind .val{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.ind .val.chico{font-size:17px}
.ind .nota{font-size:11.5px;color:var(--texto-3);line-height:1.35}
.reng{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dotted var(--linea-2)}
.reng b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.veredicto{
  margin-top:14px;padding:10px 12px;border-radius:3px;font-size:12.5px;line-height:1.45;
  background:var(--verde-l);border-left:3px solid var(--verde);
}
.veredicto.malo{background:var(--rojo-l);border-left-color:var(--rojo)}
.veredicto.tibio{background:var(--ambar-l);border-left-color:var(--ambar)}
.veredicto b{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}

/* ---------- Avisos y acotaciones ---------- */
.nota{
  border-left:3px solid var(--cian);background:#F0F7FB;padding:11px 13px;
  font-size:13px;line-height:1.5;color:#294455;border-radius:0 3px 3px 0;margin:12px 0 0;
}
.nota strong{color:var(--tinta)}
.nota.amb{border-left-color:var(--ambar);background:var(--ambar-l);color:#5B4416}
.nota.mal{border-left-color:var(--rojo);background:var(--rojo-l);color:#6B2A20}
.nota.ok{border-left-color:var(--verde);background:var(--verde-l);color:#1F5C3B}
.nota .et{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px;opacity:.75}
.notas-lista{display:grid;gap:9px}

.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--linea-2)}
.tarjeta{background:#fff;padding:12px 14px}
.tarjeta .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-2)}
.tarjeta .val{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.tarjeta .val small{font-size:12px;font-weight:400;color:var(--texto-3)}

.chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:#EEF2EC;color:var(--texto-2)}
.chip.f{background:#E8EEF4;color:#2C5773}
.chip.v{background:#FBF0DF;color:#8A6415}

svg.graf{width:100%;height:auto;display:block;font-family:var(--mono);font-size:10px}
svg.graf text{fill:var(--texto-2)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .tape{grid-column:1/-1;position:static;height:auto;border-left:none;border-top:1px solid var(--linea)}
  .tape .cinta{max-width:640px;margin:0 auto}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column}
  .pasos{display:flex;overflow-x:auto;padding:0}
  .paso{border-left:none;border-bottom:3px solid transparent;grid-template-columns:1fr;white-space:nowrap;padding:10px 14px}
  .paso.on{border-left:none;border-bottom-color:var(--cian)}
  .work{padding:20px 16px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .enc h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Encabezado sólo para impresión ---------- */
.solo-print{display:none}
@media print{
  .solo-print{display:block;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:14px}
  .solo-print h1{font-size:15px}
  .solo-print .met{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-top:3px}
}

/* ---------- Impresión ---------- */
@media print{
  body{background:#fff;font-size:11px}
  .app{display:block}
  .rail,.tape,.acciones,button,.no-print{display:none!important}
  .work{padding:0;max-width:none}
  .panel{display:block!important;page-break-after:always}
  .bloque{break-inside:avoid;border-color:#bbb}
  thead th{position:static}
  .enc h2{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="marca">
      <div class="kicker">UNCAUS · Marketing 2025</div>
      <h1>Estudio económico</h1>
      <div class="sub">Del costo unitario a la TIR, paso por paso.</div>
    </div>
    <ul class="pasos" id="pasos"></ul>
    <div class="rail-pie">
      <div class="mini">Tu trabajo</div>
      <button data-act="guardar">Guardar avance (.json)</button>
      <button data-act="abrir">Abrir avance guardado</button>
      <button data-act="imprimir">Imprimir / Guardar PDF</button>
      <button data-act="ejemplo">Ver un ejemplo cargado</button>
      <button data-act="limpiar">Empezar de cero</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </aside>
  <main class="work" id="work"></main>
  <aside class="tape"><div class="cinta" id="cinta"></div></aside>
</div>
<script>
"use strict";
/* ============================================================
   ESTUDIO ECONÓMICO — Plan de negocios
   Aplicación autónoma (un solo archivo). Sin dependencias.
   ============================================================ */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
let UID = 1; const uid = () => "k" + (UID++);

function num(v){
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v === null || v === undefined) return 0;
  let s = String(v).trim().replace(/\s/g,"").replace(/[^0-9,.\-]/g,"");
  if (!s) return 0;
  const c = s.lastIndexOf(","), p = s.lastIndexOf(".");
  if (c > -1 && p > -1){ s = c > p ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if (c > -1){ s = s.replace(/\./g,"").replace(",","."); }
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const ent = v => Math.round(num(v));
const suma = a => a.reduce((x,y)=>x+num(y),0);
const clamp = (x,a,b) => Math.min(b, Math.max(a,x));

const nf = (d) => new Intl.NumberFormat("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
function fmt(x, d){
  if (!isFinite(x)) return "—";
  if (d === undefined) d = (Math.abs(x) >= 1000 || x === 0) ? 0 : 2;
  return nf(d).format(x);
}
const $$ = (x,d) => (isFinite(x) ? S.meta.moneda + " " + fmt(x,d) : "—");
const pct = (x,d) => (isFinite(x) ? fmt(x*100, d===undefined?1:d) + " %" : "—");
const esc = s => String(s===undefined||s===null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- catálogos ---------- */
const G_INV = [
  {k:"terreno",  t:"Terrenos e infraestructura", clase:"fijo",  dep:false},
  {k:"maquina",  t:"Maquinarias y equipos",      clase:"fijo",  dep:true},
  {k:"herram",   t:"Herramientas",               clase:"fijo",  dep:true},
  {k:"mueble",   t:"Muebles y enseres",          clase:"fijo",  dep:true},
  {k:"preop",    t:"Gastos pre operativos",      clase:"preop", dep:false},
  {k:"ctrab",    t:"Capital de trabajo",         clase:"ctrab", dep:false}
];
const G_COS = [
  {k:"materia",  t:"Materiales e insumos",   clase:"directo",   sug:"V"},
  {k:"mano",     t:"Mano de obra",           clase:"directo",   sug:"V"},
  {k:"fabrica",  t:"Gastos de fabricación",  clase:"directo",   sug:"F"},
  {k:"admin",    t:"Gastos administrativos", clase:"indirecto", sug:"F"},
  {k:"venta",    t:"Gastos de ventas",       clase:"indirecto", sug:"F"}
];
const tInv = k => (G_INV.find(g=>g.k===k)||{}).t || k;
const tCos = k => (G_COS.find(g=>g.k===k)||{}).t || k;

/* ---------- estado ---------- */
function vacio(){
  return {
    paso: 0,
    meta: { nombre:"", autor:"", moneda:"$", periodo:"mes", n:12, tasa:"35", imp:"0",
            ref:1, recuperaCT:true, residual:"0", escudo:false, vida:"10",
            fin:{ usa:false, monto:"", tasa:"", plazo:"", gracia:"0", gastos:"0", sistema:"frances", ke:"" } },
    productos: [ prodNuevo() ],
    inversion: [],
    costos: [],
    _serie: { prod:0, base:"", crec:"" }
  };
}
function prodNuevo(){ return { id:uid(), nombre:"", markup:"30", modo:"auto", precio:"", u:[] }; }
let S = vacio();

function setPath(path, val){
  const p = path.split("."); let o = S;
  for (let i=0;i<p.length-1;i++){
    const key = /^\d+$/.test(p[i]) ? Number(p[i]) : p[i];
    o = o[key];
  }
  const last = /^\d+$/.test(p[p.length-1]) ? Number(p[p.length-1]) : p[p.length-1];
  o[last] = val;
}

/* ============================================================
   MOTOR DE CÁLCULO
   ============================================================ */
function calcular(){
  const m = S.meta;
  const n = clamp(ent(m.n)||1, 1, 60);
  const k = m.periodo === "mes" ? 12 : 1;              // períodos por año
  const rAnual = num(m.tasa)/100;
  const r = Math.pow(1+rAnual, 1/k) - 1;               // tasa por período
  const tax = clamp(num(m.imp)/100, 0, 0.95);
  const ref = clamp(ent(m.ref)||1, 1, n);

  /* --- productos y unidades --- */
  const P = S.productos.map(p => {
    const u = []; for (let t=0;t<n;t++) u.push(num(p.u[t]));
    return { id:p.id, nombre:p.nombre || "Producto sin nombre", markup:num(p.markup)/100,
             modo:p.modo, precioManual:num(p.precio), u:u, uCiclo:suma(u) };
  });
  const uPer = Array.from({length:n}, (_,t) => suma(P.map(p=>p.u[t])));
  const uCiclo = suma(uPer);
  const uProm = uCiclo / n;

  /* --- inversión --- */
  const invItems = S.inversion.map(i => ({...i, total: num(i.vu)*num(i.cant)}));
  const porGrupoInv = {}; G_INV.forEach(g => porGrupoInv[g.k] = suma(invItems.filter(i=>i.grupo===g.k).map(i=>i.total)));
  const activoFijo = G_INV.filter(g=>g.clase==="fijo").reduce((s,g)=>s+porGrupoInv[g.k],0);
  const depreciable = G_INV.filter(g=>g.dep).reduce((s,g)=>s+porGrupoInv[g.k],0);
  const preop = porGrupoInv.preop, ctrab = porGrupoInv.ctrab;
  const inv0 = activoFijo + preop + ctrab;

  /* --- costos por período --- */
  const cosItems = S.costos.map(c => ({...c, total: num(c.vu)*num(c.cant)}));
  const fijoG = {}, varG = {};
  G_COS.forEach(g => {
    fijoG[g.k] = suma(cosItems.filter(c=>c.grupo===g.k && c.tipo==="F").map(c=>c.total));
    varG[g.k]  = suma(cosItems.filter(c=>c.grupo===g.k && c.tipo==="V").map(c=>c.total));
  });
  const CF = G_COS.reduce((s,g)=>s+fijoG[g.k],0);          // costo fijo por período
  const CV = G_COS.reduce((s,g)=>s+varG[g.k],0);           // costo variable del período de referencia
  const directos  = G_COS.filter(g=>g.clase==="directo").reduce((s,g)=>s+fijoG[g.k]+varG[g.k],0);
  const indirectos= G_COS.filter(g=>g.clase==="indirecto").reduce((s,g)=>s+fijoG[g.k]+varG[g.k],0);

  /* --- base de unidades para unitarizar los costos variables --- */
  let base = P.map(p => p.u[ref-1]);
  if (suma(base) <= 0) base = P.map(p => p.uCiclo / n);
  const baseTot = suma(base);

  /* costo variable unitario por grupo y por producto */
  const cvuGI = {};
  G_COS.forEach(g => {
    const asign = P.map(p => suma(cosItems.filter(c=>c.grupo===g.k && c.tipo==="V" && c.prod===p.id).map(c=>c.total)));
    const libre = varG[g.k] - suma(asign);
    cvuGI[g.k] = P.map((p,i) => (base[i]>0 ? asign[i]/base[i] : 0) + (baseTot>0 ? libre/baseTot : 0));
  });
  const CVU = P.map((p,i) => G_COS.reduce((s,g)=>s+cvuGI[g.k][i], 0));
  const CFU = uCiclo > 0 ? (CF*n)/uCiclo : 0;              // costo fijo unitario del ciclo
  const CTU = CVU.map(c => c + CFU);
  const precio = P.map((p,i) => p.modo === "manual" ? p.precioManual : CTU[i]*(1+p.markup));
  const MC = P.map((p,i) => precio[i] - CVU[i]);
  const mix = P.map(p => uCiclo>0 ? p.uCiclo/uCiclo : (P.length?1/P.length:0));
  const MCpond = P.reduce((s,p,i)=> s + mix[i]*MC[i], 0);
  const Ppond  = P.reduce((s,p,i)=> s + mix[i]*precio[i], 0);
  const razonMC = Ppond > 0 ? MCpond/Ppond : 0;

  /* --- punto de equilibrio (por período) --- */
  const PEq  = MCpond > 0 ? CF/MCpond : Infinity;
  const PEqi = mix.map(w => PEq*w);
  const PE$  = MCpond > 0 ? CF/razonMC : Infinity;
  const PEproyecto = MCpond > 0 ? (CF*n + inv0)/MCpond : Infinity;  // incluye recuperar la inversión
  const ventasProm = P.reduce((s,p,i)=> s + precio[i]*p.uCiclo, 0)/n;
  const margenSeg = ventasProm > 0 && isFinite(PE$) ? (ventasProm - PE$)/ventasProm : NaN;
  const MCtotal = MCpond * uProm;
  const GAO = (MCtotal - CF) !== 0 ? MCtotal/(MCtotal - CF) : NaN;

  /* --- financiamiento --- */
  const fn = m.fin || {};
  const usaFin = !!fn.usa;
  const montoP = Math.max(0, num(fn.monto));
  const tna = num(fn.tasa)/100;
  const iP = tna/k;                                   // tasa por período (nominal capitalizable)
  const TEA = Math.pow(1+iP, k) - 1;                  // costo efectivo anual
  const plazo = clamp(ent(fn.plazo)||0, 0, 600);
  const gracia = clamp(ent(fn.gracia)||0, 0, Math.max(0,plazo-1));
  const gastosOt = montoP * num(fn.gastos)/100;
  const sistema = fn.sistema === "aleman" ? "aleman" : "frances";
  const aporte = inv0 - montoP;
  const wD = inv0 > 0 ? Math.min(1, montoP/inv0) : 0;
  const kE = num(fn.ke) > 0 ? num(fn.ke)/100 : rAnual;
  const kEp = Math.pow(1+kE, 1/k) - 1;
  const kD = TEA * (1 - tax);
  const WACC = usaFin && inv0 > 0 ? wD*kD + (1-wD)*kE : rAnual;

  const credito = [];
  if (usaFin && montoP > 0 && plazo > 0){
    let saldo = montoP;
    const mAm = Math.max(1, plazo - gracia);
    const cuotaF = iP > 0 ? montoP*iP/(1-Math.pow(1+iP,-mAm)) : montoP/mAm;
    for (let t=0;t<plazo;t++){
      const int = saldo*iP;
      let am = 0;
      if (t >= gracia) am = (sistema === "aleman") ? montoP/mAm : cuotaF - int;
      am = clamp(am, 0, saldo);
      credito.push({t:t+1, ini:saldo, int:int, am:am, cuota:int+am, fin:saldo-am});
      saldo -= am;
    }
  }
  const interP = Array.from({length:n}, (_,t) => credito[t] ? credito[t].int : 0);
  const amortP = Array.from({length:n}, (_,t) => credito[t] ? credito[t].am : 0);
  const cuotaP = Array.from({length:n}, (_,t) => credito[t] ? credito[t].cuota : 0);
  const saldoFinal = (plazo > n && credito[n-1]) ? credito[n-1].fin : 0;   // cancelación al cierre del análisis
  const cuotaTipo = credito.length ? credito[Math.min(gracia, credito.length-1)].cuota : 0;
  const interesTotal = suma(credito.map(c=>c.int));

  /* --- flujo de efectivo (con multiplicadores para sensibilidad) --- */
  const vidaPer = Math.max(1, num(m.vida)*k);
  function armarFlujo(mu){
    mu = Object.assign({precio:1, unid:1, cv:1, cf:1, inv:1}, mu||{});
    const I = inv0*mu.inv;
    const Ifin = I - montoP + gastosOt;
    const filas = { ingresos:[], egresos:[], sai:[], imp:[], fn:[], dep:[], recup:[], impF:[], fnFin:[] };
    const egG = {}; G_COS.forEach(g => egG[g.k] = []);
    for (let t=0;t<n;t++){
      const ing = P.reduce((s,p,i)=> s + precio[i]*mu.precio * p.u[t]*mu.unid, 0);
      let eg = 0;
      G_COS.forEach(g => {
        const v = P.reduce((s,p,i)=> s + cvuGI[g.k][i]*mu.cv * p.u[t]*mu.unid, 0) + fijoG[g.k]*mu.cf;
        egG[g.k].push(v); eg += v;
      });
      const sai = ing - eg;
      const dep = (m.escudo && t < vidaPer) ? (depreciable*mu.inv)/vidaPer : 0;
      const imp = tax * Math.max(0, sai - dep);
      const impF = tax * Math.max(0, sai - dep - interP[t]);
      let rec = 0;
      if (t === n-1){
        rec += (m.recuperaCT ? ctrab*mu.inv : 0);
        rec += activoFijo*mu.inv*(num(m.residual)/100);
      }
      filas.ingresos.push(ing); filas.egresos.push(eg); filas.sai.push(sai);
      filas.dep.push(dep); filas.imp.push(imp); filas.impF.push(impF); filas.recup.push(rec);
      filas.fn.push(sai - imp + rec);
      filas.fnFin.push(sai - impF - cuotaP[t] + rec - (t === n-1 ? saldoFinal : 0));
    }
    return { I, Ifin, filas, egG };
  }
  const F = armarFlujo();

  const van = (flujos, I, tasa) => flujos.reduce((s,f,t)=> s + f/Math.pow(1+tasa, t+1), 0) - I;
  const VAN = van(F.filas.fn, F.I, r);
  const VPflujos = F.filas.fn.reduce((s,f,t)=> s + f/Math.pow(1+r, t+1), 0);
  const IR = F.I > 0 ? VPflujos/F.I : NaN;

  function tir(flujos, I){
    if (I <= 0) return NaN;
    const f = x => van(flujos, I, x);
    let a = -0.9999, b = 10, fa = f(a), fb = f(b);
    if (!isFinite(fa) || !isFinite(fb) || fa*fb > 0) return NaN;
    for (let i=0;i<200;i++){
      const c = (a+b)/2, fc = f(c);
      if (fa*fc <= 0){ b = c; fb = fc; } else { a = c; fa = fc; }
      if (Math.abs(b-a) < 1e-9) break;
    }
    return (a+b)/2;
  }
  const TIR = tir(F.filas.fn, F.I);
  const TIRa = isFinite(TIR) ? Math.pow(1+TIR, k) - 1 : NaN;

  /* --- evaluación del inversionista (después de la deuda) --- */
  const VANF = usaFin ? van(F.filas.fnFin, F.Ifin, kEp) : NaN;
  const TIRF = usaFin ? tir(F.filas.fnFin, F.Ifin) : NaN;
  const TIRFa = isFinite(TIRF) ? Math.pow(1+TIRF, k) - 1 : NaN;
  const cobertura = [];
  for (let t=0;t<n;t++) if (cuotaP[t] > 0) cobertura.push((F.filas.sai[t]-F.filas.impF[t])/cuotaP[t]);
  const dscrMin = cobertura.length ? Math.min(...cobertura) : NaN;
  const dscrProm = cobertura.length ? suma(cobertura)/cobertura.length : NaN;
  let acF = -F.Ifin, paybackF = NaN;
  const acumFArr = [];
  for (let t=0;t<n;t++){
    const prev = acF; acF += F.filas.fnFin[t]; acumFArr.push(acF);
    if (!isFinite(paybackF) && prev < 0 && acF >= 0) paybackF = t + (F.filas.fnFin[t]!==0 ? (-prev)/F.filas.fnFin[t] : 0);
  }

  /* recupero de la inversión */
  let acum = -F.I, acumD = -F.I, payback = NaN, paybackD = NaN;
  const acumArr = [], acumDArr = [];
  for (let t=0;t<n;t++){
    const prev = acum, prevD = acumD;
    acum += F.filas.fn[t];
    acumD += F.filas.fn[t]/Math.pow(1+r, t+1);
    acumArr.push(acum); acumDArr.push(acumD);
    if (!isFinite(payback) && prev < 0 && acum >= 0) payback = t + (F.filas.fn[t]!==0 ? (-prev)/F.filas.fn[t] : 0);
    if (!isFinite(paybackD) && prevD < 0 && acumD >= 0){
      const d = F.filas.fn[t]/Math.pow(1+r,t+1);
      paybackD = t + (d!==0 ? (-prevD)/d : 0);
    }
  }
  const ROI = F.I > 0 ? (suma(F.filas.fn) - F.I)/F.I : NaN;

  /* sensibilidad */
  function vanCon(mu){ const x = armarFlujo(mu); return { van: van(x.filas.fn, x.I, r), tir: tir(x.filas.fn, x.I) }; }
  const sens = [
    {v:"Precio de venta",        key:"precio"},
    {v:"Unidades vendidas",      key:"unid"},
    {v:"Costos variables",       key:"cv"},
    {v:"Costos fijos",           key:"cf"},
    {v:"Monto de la inversión",  key:"inv"}
  ].map(s => {
    const f = d => { const mu = {}; mu[s.key] = 1+d; return vanCon(mu); };
    return { v:s.v, m20:f(-0.20), m10:f(-0.10), p10:f(0.10), p20:f(0.20) };
  });

  /* factor de quiebre: cuánto tienen que moverse precio o unidades para VAN = 0 */
  function quiebre(key){
    const f = x => { const mu = {}; mu[key] = x; return van(armarFlujo(mu).filas.fn, armarFlujo(mu).I, r); };
    let a = 0.2, b = 5;
    let fa = f(a), fb = f(b);
    if (!isFinite(fa) || !isFinite(fb) || fa*fb > 0) return NaN;
    for (let i=0;i<80;i++){ const c=(a+b)/2, fc=f(c); if (fa*fc<=0){b=c;fb=fc;} else {a=c;fa=fc;} }
    return (a+b)/2;
  }

  return { n, k, r, rAnual, tax, ref, P, uPer, uCiclo, uProm,
           invItems, porGrupoInv, activoFijo, depreciable, preop, ctrab, inv0,
           cosItems, fijoG, varG, CF, CV, directos, indirectos, cvuGI, base, baseTot,
           CVU, CFU, CTU, precio, MC, mix, MCpond, Ppond, razonMC,
           PEq, PEqi, PE$, PEproyecto, ventasProm, margenSeg, GAO, MCtotal,
           F, VAN, VPflujos, IR, TIR, TIRa, payback, paybackD, ROI, acumArr, acumDArr,
           usaFin, montoP, tna, iP, TEA, plazo, gracia, gastosOt, sistema, aporte, wD, kE, kEp, kD, WACC,
           credito, interP, amortP, cuotaP, saldoFinal, cuotaTipo, interesTotal,
           VANF, TIRF, TIRFa, dscrMin, dscrProm, paybackF, acumFArr,
           sens, quiebre, van, armarFlujo, vidaPer };
}

   ============================================================ */
function getPath(path){
  return path.split(".").reduce((acc,key)=> (acc==null ? acc : acc[/^\d+$/.test(key)?Number(key):key]), S);
}
function inp(path, o){
  o = o || {};
  const v = getPath(path);
  return `<input type="text" data-k="${path}" ${o.num?'class="num" inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(o.ph||"")}" ${o.ro?"readonly":""} ${o.aria?`aria-label="${esc(o.aria)}"`:""}>`;
}
function sel(path, ops){
  const v = getPath(path);
  return `<select data-k="${path}">` + ops.map(o=>`<option value="${esc(o[0])}" ${String(v)===String(o[0])?"selected":""}>${esc(o[1])}</option>`).join("") + `</select>`;
}
function chk(path, texto, hint){
  const v = getPath(path);
  return `<label class="check"><input type="checkbox" data-k="${path}" data-tipo="bool" ${v?"checked":""}><span>${texto}${hint?`<span class="hint">${hint}</span>`:""}</span></label>`;
}
const campo = (t, html, hint) => `<label class="campo"><span>${t}</span>${html}${hint?`<span class="hint">${hint}</span>`:""}</label>`;
const nota = (clase, et, txt) => `<div class="nota ${clase}">${et?`<span class="et">${et}</span>`:""}${txt}</div>`;
const perLabel = () => S.meta.periodo === "mes" ? "mes" : "año";
const perLabelPl = () => S.meta.periodo === "mes" ? "meses" : "años";

  {n:"4.7", t:"Flujo de efectivo"},
  {n:"4.9", t:"Indicadores y lectura"}
];

function normaliza(){
  const n = clamp(ent(S.meta.n)||1, 1, 60);
  S.productos.forEach(p => {
    if (!Array.isArray(p.u)) p.u = [];
    while (p.u.length < n) p.u.push("");
    p.u.length = n;
  });
  if (!S.productos.length) S.productos.push(prodNuevo());
}

<div class="enc">
